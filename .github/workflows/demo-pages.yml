# 示範站：每次 main 有更新，就把 site/ 組成「示範模式」（虛構的一班、資料只存在瀏覽器）
# 部署到本 repo 的 GitHub Pages。示範站不含任何 Firebase 設定，也不連任何資料庫。
# fork 的人若不需要示範站，到 Settings → Pages 關掉即可。
name: demo-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設只給讀；寫 Pages 的權限只給 deploy 那個 job（組站的 job 拿不到）。
permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 組示範站
        run: python scripts/build_site.py --demo --out build/demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/demo
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
