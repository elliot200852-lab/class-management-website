# CI：這個 repo 是公開的，GitHub Actions 對 public repo 免費。
# push 到 main、pull request、手動觸發都跑完整矩陣——這是 Windows 路徑唯一的自動驗證管道，
# 千萬別為了省事只跑 ubuntu：pathlib／編碼／換行這幾個平台差異只有真的在 Windows runner 上跑過才抓得到。
#
# CI 跟你在自己電腦上跑的是同一支腳本（scripts/check.py：一行跑完 unittest ＋ privacy_scan），
# 不會有「本機過、CI 卻紅」的落差。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN 只給讀：四個 job 都只需要 checkout，不寫 repo、不發 release（不管 repo 的預設權限設成什麼）。
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Pillow：照片處理的單元測試（清 EXIF／GPS、轉正、品質階梯）要跑到。老師的電腦由老師照官方說明自己裝。
      - name: 裝 Pillow（照片處理的測試用）
        run: python -m pip install Pillow
      - name: check（unittest ＋ privacy_scan）
        run: python scripts/check.py

  # 安全規則的模擬器測試（v1 唯一的伺服器端防線，只能靠模擬器驗）。模擬器行為與平台無關，只在 ubuntu 跑。
  # 這裡裝 Java／Node 是 CI 機器自己的事，不違反「不替老師代裝」；老師的電腦不跑這一層。
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      - name: 規則測試（Firestore 模擬器＋存取次數靜態檢查）
        run: python scripts/test_rules.py
      - name: 裝 Pillow（管理腳本整合測試要處理照片）
        run: python -m pip install Pillow
      - name: 管理腳本整合測試（名單同步、發文、開部落格寫進模擬器，再用真規則讀回）
        run: python scripts/check.py --integration

  # 模擬器冒煙測試（docs/ARCHITECTURE.md §8.4）：真的 Firebase JS SDK＋真的安全規則＋正式站模式（不是示範模式），
  # 無頭 Chrome 用五種登入身分逐頁驗（零主控台錯誤、看得到自己孩子看不到別人、留言、發文照片去 EXIF、已讀回條）。
  # 排在規則測試之後：規則沒過，冒煙測試也沒有意義。Chrome 由官方 action 裝（CMW_CHROME 指給腳本）；
  # CI 的 Linux 機器常不准 Chrome 開沙箱，所以只在這裡補 --no-sandbox。老師的電腦不跑這一層。
  smoke:
    runs-on: ubuntu-24.04
    needs: rules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/rules/package-lock.json
      # 第三方 action 釘死 commit（tag 可以被改寫）；升版時照 tag 重查 SHA、改註解。
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: 模擬器冒煙測試（Auth＋Firestore 模擬器、無頭 Chrome）
        env:
          CMW_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CMW_CHROME_ARGS: --no-sandbox
        run: python scripts/smoke_emulator.py --require-chrome

  # v1.1 選配通知信模組（functions/）：Firestore＋Functions 模擬器、假的郵差（絕不真的寄信），專案 demo- 開頭。
  # Node 22＝正式部署的 Cloud Functions 執行環境版本。老師的電腦不跑這一層。
  functions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tests/rules/package-lock.json
            functions/package-lock.json
      - name: 通知信模組測試（佇列延遲與取消、回填閘、dryrun、逐人台帳、觸發器接線）
        run: python scripts/test_functions.py
