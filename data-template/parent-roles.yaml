# parent-roles.yaml — 每個座號「應該有網站帳號」的家長稱謂。這份是名單同步的安全閘正本。
#
# 這裡是 data-template/ 的空白範本；真的內容只在你電腦的 data/parent-roles.yaml（不進 git）。
# 這個檔**不放 email、不放姓名**，只寫「哪個座號有幾位家長要開帳號、稱謂是什麼」。
#
# 為什麼要有它：scripts/access_sync.py 從 data/contacts.csv 讀家長的 email。萬一 contacts.csv
# 被存壞、被截斷（例如 Excel 只存到一半），同步時會以為那些家長「不在了」。這份檔告訴程式
# 「本來應該有幾位」：contacts.csv 有 email 的家長位置比這裡宣告的少 3 個以上，同步就停下來、一筆都不寫。
#
# 寫法（兩種都可以；座號兩位數、稱謂要跟 contacts.csv 的「關係」欄一模一樣）：
#
#   "01": [母, 父]
#   "02": [母]
#   "03": []              ← 這位孩子的家長還沒有帳號（或不需要）
#
#   "04":
#     - 母
#     - 祖母
#
# 什麼時候要改這份：學生轉入／轉出、某位家長要開帳號或不再需要帳號時。改完再跑 access_sync.py。
# 同仁不寫在這裡（寫在 contacts.csv，「關係」欄填「同仁」）。
